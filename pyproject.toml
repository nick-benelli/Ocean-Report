[project]
name = "ocean-report"
version = "0.1.0"
description = "Pulls ocean and wind data and generates a report to be emailed."
readme = "README.md"
authors = [
    { name = "Nick-Benelli", email = "31021342+nick-benelli@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025.6.15",
    "ipykernel>=6.29.5",
    "jinja2>=3.1.6",
    "pandas>=2.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
ocean-report = "ocean_report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "performance: marks tests as performance/speed tests",
    "benchmark: marks tests as detailed performance benchmarks",
    "error_quality: marks tests that verify error message quality",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/ocean_report"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (Pydantic uses this)
    "B904",  # use `raise ... from err` (not always applicable)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # unused arguments in test fixtures
    "S101", # assert statements in tests
]

[tool.ruff.lint.isort]
known-first-party = ["ocean_report"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
allow_untyped_calls = true
allow_untyped_defs = true
